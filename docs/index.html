<script type="application/json" id="lesson-data">{"pages": [{"title": "Host、Client與Server", "created": "2026-11-23", "updated": "2026-11-23", "type": "concept", "confidence": "high", "contested": false, "tags": ["architecture"], "sources": [1], "claims": [{"id": "host", "text": "Host是使用者操作的AI應用，負責管理Client、整合模型，以及落實權限與使用者同意政策。", "sources": [1]}, {"id": "client", "text": "Client是Host內的協定連接元件；每個Client與一個Server維持一對一連線。Host可建立多個Client來連接不同Server。", "sources": [1]}, {"id": "server", "text": "Server提供特定的工具、資源或提示模板，可以是本機程序，也可以是遠端服務；Server不等於一定架在雲端。", "sources": [1]}], "slug": "architecture", "body": "\n# Host、Client與Server\n\nHost是使用者操作的AI應用，負責管理Client、整合模型，以及落實權限與使用者同意政策。[1]\n\nClient是Host內的協定連接元件；每個Client與一個Server維持一對一連線。Host可建立多個Client來連接不同Server。[1]\n\nServer提供特定的工具、資源或提示模板，可以是本機程序，也可以是遠端服務；Server不等於一定架在雲端。[1]\n\n## 相關頁面\n\n- [[mcp-overview]]\n- [[lifecycle]]\n\n## Sources\n\n[1] https://modelcontextprotocol.io/specification/2025-11-25/architecture — Architecture\n", "links": ["mcp-overview", "lifecycle"]}, {"title": "連得上不等於有權限", "created": "2026-11-23", "updated": "2026-11-23", "type": "concept", "confidence": "high", "contested": false, "tags": ["authorization"], "sources": [6, 7], "claims": [{"id": "auth-scope", "text": "此版本的MCP授權規範定義HTTP傳輸的授權流程；授權支援屬選用，支援時仍須遵循相關要求，不能說所有MCP連線都強制使用OAuth。HTTP也可以在本機執行，不能把HTTP和遠端服務畫上等號。", "sources": [6, 7]}, {"id": "stdio-scope", "text": "STDIO透過程序的標準輸入與輸出交換訊息。這類本機程序不應照搬HTTP授權流程，而從環境取得憑證；如何隔離程序、給多少權限，仍是實作要處理的問題。", "sources": [6, 7]}], "slug": "authorization", "body": "\n# 連得上不等於有權限\n\n此版本的MCP授權規範定義HTTP傳輸的授權流程；授權支援屬選用，支援時仍須遵循相關要求，不能說所有MCP連線都強制使用OAuth。HTTP也可以在本機執行，不能把HTTP和遠端服務畫上等號。[6][7]\n\nSTDIO透過程序的標準輸入與輸出交換訊息。這類本機程序不應照搬HTTP授權流程，而從環境取得憑證；如何隔離程序、給多少權限，仍是實作要處理的問題。[6][7]\n\n## 相關頁面\n\n- [[trust-boundaries]]\n- [[architecture]]\n\n## Sources\n\n[6] https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization — Authorization\n[7] https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices — Security Best Practices\n", "links": ["trust-boundaries", "architecture"]}, {"title": "先協商，再使用支援的能力", "created": "2026-11-23", "updated": "2026-11-23", "type": "concept", "confidence": "high", "contested": false, "tags": ["lifecycle"], "sources": [1, 5], "claims": [{"id": "handshake", "text": "連接開始時以initialize交換協定版本及能力，再以notifications/initialized表示Client已準備好，之後進入正常操作。", "sources": [5]}, {"id": "capabilities", "text": "能力協商讓雙方知道哪些功能可以使用。不能看到一個Server叫做MCP Server，就假設它提供所有工具、資源與提示。", "sources": [1, 5]}], "slug": "lifecycle", "body": "\n# 先協商，再使用支援的能力\n\n連接開始時以initialize交換協定版本及能力，再以notifications/initialized表示Client已準備好，之後進入正常操作。[5]\n\n能力協商讓雙方知道哪些功能可以使用。不能看到一個Server叫做MCP Server，就假設它提供所有工具、資源與提示。[1][5]\n\n## 相關頁面\n\n- [[architecture]]\n- [[tools]]\n\n## Sources\n\n[1] https://modelcontextprotocol.io/specification/2025-11-25/architecture — Architecture\n[5] https://modelcontextprotocol.io/specification/2025-11-25/basic/lifecycle — Lifecycle\n", "links": ["architecture", "tools"]}, {"title": "MCP解決什麼問題", "created": "2026-11-23", "updated": "2026-11-23", "type": "concept", "confidence": "high", "contested": false, "tags": ["intro"], "sources": [1, 5], "claims": [{"id": "definition", "text": "MCP是讓AI應用與外部能力交換訊息的協定。它規範連接及訊息格式，不是大型語言模型本身。", "sources": [1]}, {"id": "integration", "text": "Server把特定能力整理成一致介面；Host管理AI整合與多個Client。共用協定有利於整合，但實際可用功能仍取決於雙方支援的能力。", "sources": [1, 5]}], "slug": "mcp-overview", "body": "\n# MCP解決什麼問題\n\nMCP是讓AI應用與外部能力交換訊息的協定。它規範連接及訊息格式，不是大型語言模型本身。[1]\n\nServer把特定能力整理成一致介面；Host管理AI整合與多個Client。共用協定有利於整合，但實際可用功能仍取決於雙方支援的能力。[1][5]\n\n## 相關頁面\n\n- [[architecture]]\n- [[tools]]\n\n## Sources\n\n[1] https://modelcontextprotocol.io/specification/2025-11-25/architecture — Architecture\n[5] https://modelcontextprotocol.io/specification/2025-11-25/basic/lifecycle — Lifecycle\n", "links": ["architecture", "tools"]}, {"title": "Resources與Prompts不等於Tools", "created": "2026-11-23", "updated": "2026-11-23", "type": "concept", "confidence": "high", "contested": false, "tags": ["resources", "prompts"], "sources": [1, 2, 3, 4], "claims": [{"id": "resources", "text": "Resources用來提供模型參考的上下文資料，例如檔案或資料庫結構。每個資源以URI識別，由應用決定如何放進上下文。", "sources": [3]}, {"id": "prompts", "text": "Prompts是Server提供的結構化訊息模板，可以接受參數；設計上偏向由使用者明確選用，並非模型的私密思考。", "sources": [4]}, {"id": "primitive-distinction", "text": "記憶方式：Tool對外執行操作，Resource提供上下文，Prompt提供互動模板。這是三種用途的區分，不表示每個Server都必須同時提供三種功能。", "sources": [1, 2, 3, 4]}], "slug": "resources-prompts", "body": "\n# Resources與Prompts不等於Tools\n\nResources用來提供模型參考的上下文資料，例如檔案或資料庫結構。每個資源以URI識別，由應用決定如何放進上下文。[3]\n\nPrompts是Server提供的結構化訊息模板，可以接受參數；設計上偏向由使用者明確選用，並非模型的私密思考。[4]\n\n記憶方式：Tool對外執行操作，Resource提供上下文，Prompt提供互動模板。這是三種用途的區分，不表示每個Server都必須同時提供三種功能。[1][2][3][4]\n\n## 相關頁面\n\n- [[tools]]\n- [[mcp-overview]]\n\n## Sources\n\n[1] https://modelcontextprotocol.io/specification/2025-11-25/architecture — Architecture\n[2] https://modelcontextprotocol.io/specification/2025-11-25/server/tools — Tools\n[3] https://modelcontextprotocol.io/specification/2025-11-25/server/resources — Resources\n[4] https://modelcontextprotocol.io/specification/2025-11-25/server/prompts — Prompts\n", "links": ["tools", "mcp-overview"]}, {"title": "Tools：請外部系統做一件事", "created": "2026-11-23", "updated": "2026-11-23", "type": "concept", "confidence": "high", "contested": false, "tags": ["tools"], "sources": [2], "claims": [{"id": "tool-schema", "text": "Tool用名稱、用途說明及輸入綱要描述可執行的操作。Client可透過tools/list取得清單，再以tools/call傳送工具名稱與參數；Server仍須驗證工具輸入並落實存取控制。", "sources": [2]}, {"id": "tool-control", "text": "Tools的設計偏向由模型依情境選用，但協定不強制某種操作介面。應用仍應提供讓人拒絕工具呼叫的能力，不能把模型想呼叫視為使用者已授權。", "sources": [2]}, {"id": "tool-result", "text": "Server回傳工具結果後，AI應用可以把結果交給模型繼續整理回答；回傳工具錯誤時，也應辨識錯誤而不是把它當成功結果。", "sources": [2]}], "slug": "tools", "body": "\n# Tools：請外部系統做一件事\n\nTool用名稱、用途說明及輸入綱要描述可執行的操作。Client可透過tools/list取得清單，再以tools/call傳送工具名稱與參數；Server仍須驗證工具輸入並落實存取控制。[2]\n\nTools的設計偏向由模型依情境選用，但協定不強制某種操作介面。應用仍應提供讓人拒絕工具呼叫的能力，不能把模型想呼叫視為使用者已授權。[2]\n\nServer回傳工具結果後，AI應用可以把結果交給模型繼續整理回答；回傳工具錯誤時，也應辨識錯誤而不是把它當成功結果。[2]\n\n## 相關頁面\n\n- [[architecture]]\n- [[trust-boundaries]]\n\n## Sources\n\n[2] https://modelcontextprotocol.io/specification/2025-11-25/server/tools — Tools\n", "links": ["architecture", "trust-boundaries"]}, {"title": "MCP不會自動保證安全", "created": "2026-11-23", "updated": "2026-11-23", "type": "concept", "confidence": "high", "contested": false, "tags": ["security"], "sources": [1, 2, 6, 7], "claims": [{"id": "least-privilege", "text": "MCP的安全仍依賴實作。限制可用工具、縮小資料範圍與權限，並讓使用者看得懂將執行什麼，能減少不必要的風險。", "sources": [1, 2, 7]}, {"id": "token-boundary", "text": "MCP Server應驗證入站Token的有效性與適用對象；呼叫下游API時應另行取得下游所需的Token，不得把收到的Token原樣轉送。這項禁令不會因為入站Token已驗證就消失。", "sources": [6, 7]}, {"id": "conversation-boundary", "text": "架構設計要求Server只取得必要情境，而非看遍完整對話；這個邊界仍要由Host與實作落實，不是貼上MCP標籤就自動成立。", "sources": [1]}], "slug": "trust-boundaries", "body": "\n# MCP不會自動保證安全\n\nMCP的安全仍依賴實作。限制可用工具、縮小資料範圍與權限，並讓使用者看得懂將執行什麼，能減少不必要的風險。[1][2][7]\n\nMCP Server應驗證入站Token的有效性與適用對象；呼叫下游API時應另行取得下游所需的Token，不得把收到的Token原樣轉送。這項禁令不會因為入站Token已驗證就消失。[6][7]\n\n架構設計要求Server只取得必要情境，而非看遍完整對話；這個邊界仍要由Host與實作落實，不是貼上MCP標籤就自動成立。[1]\n\n## 相關頁面\n\n- [[authorization]]\n- [[tools]]\n\n## Sources\n\n[1] https://modelcontextprotocol.io/specification/2025-11-25/architecture — Architecture\n[2] https://modelcontextprotocol.io/specification/2025-11-25/server/tools — Tools\n[6] https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization — Authorization\n[7] https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices — Security Best Practices\n", "links": ["authorization", "tools"]}], "claims": {"host": {"id": "host", "text": "Host是使用者操作的AI應用，負責管理Client、整合模型，以及落實權限與使用者同意政策。", "sources": [1], "page": "architecture"}, "client": {"id": "client", "text": "Client是Host內的協定連接元件；每個Client與一個Server維持一對一連線。Host可建立多個Client來連接不同Server。", "sources": [1], "page": "architecture"}, "server": {"id": "server", "text": "Server提供特定的工具、資源或提示模板，可以是本機程序，也可以是遠端服務；Server不等於一定架在雲端。", "sources": [1], "page": "architecture"}, "auth-scope": {"id": "auth-scope", "text": "此版本的MCP授權規範定義HTTP傳輸的授權流程；授權支援屬選用，支援時仍須遵循相關要求，不能說所有MCP連線都強制使用OAuth。HTTP也可以在本機執行，不能把HTTP和遠端服務畫上等號。", "sources": [6, 7], "page": "authorization"}, "stdio-scope": {"id": "stdio-scope", "text": "STDIO透過程序的標準輸入與輸出交換訊息。這類本機程序不應照搬HTTP授權流程，而從環境取得憑證；如何隔離程序、給多少權限，仍是實作要處理的問題。", "sources": [6, 7], "page": "authorization"}, "handshake": {"id": "handshake", "text": "連接開始時以initialize交換協定版本及能力，再以notifications/initialized表示Client已準備好，之後進入正常操作。", "sources": [5], "page": "lifecycle"}, "capabilities": {"id": "capabilities", "text": "能力協商讓雙方知道哪些功能可以使用。不能看到一個Server叫做MCP Server，就假設它提供所有工具、資源與提示。", "sources": [1, 5], "page": "lifecycle"}, "definition": {"id": "definition", "text": "MCP是讓AI應用與外部能力交換訊息的協定。它規範連接及訊息格式，不是大型語言模型本身。", "sources": [1], "page": "mcp-overview"}, "integration": {"id": "integration", "text": "Server把特定能力整理成一致介面；Host管理AI整合與多個Client。共用協定有利於整合，但實際可用功能仍取決於雙方支援的能力。", "sources": [1, 5], "page": "mcp-overview"}, "resources": {"id": "resources", "text": "Resources用來提供模型參考的上下文資料，例如檔案或資料庫結構。每個資源以URI識別，由應用決定如何放進上下文。", "sources": [3], "page": "resources-prompts"}, "prompts": {"id": "prompts", "text": "Prompts是Server提供的結構化訊息模板，可以接受參數；設計上偏向由使用者明確選用，並非模型的私密思考。", "sources": [4], "page": "resources-prompts"}, "primitive-distinction": {"id": "primitive-distinction", "text": "記憶方式：Tool對外執行操作，Resource提供上下文，Prompt提供互動模板。這是三種用途的區分，不表示每個Server都必須同時提供三種功能。", "sources": [1, 2, 3, 4], "page": "resources-prompts"}, "tool-schema": {"id": "tool-schema", "text": "Tool用名稱、用途說明及輸入綱要描述可執行的操作。Client可透過tools/list取得清單，再以tools/call傳送工具名稱與參數；Server仍須驗證工具輸入並落實存取控制。", "sources": [2], "page": "tools"}, "tool-control": {"id": "tool-control", "text": "Tools的設計偏向由模型依情境選用，但協定不強制某種操作介面。應用仍應提供讓人拒絕工具呼叫的能力，不能把模型想呼叫視為使用者已授權。", "sources": [2], "page": "tools"}, "tool-result": {"id": "tool-result", "text": "Server回傳工具結果後，AI應用可以把結果交給模型繼續整理回答；回傳工具錯誤時，也應辨識錯誤而不是把它當成功結果。", "sources": [2], "page": "tools"}, "least-privilege": {"id": "least-privilege", "text": "MCP的安全仍依賴實作。限制可用工具、縮小資料範圍與權限，並讓使用者看得懂將執行什麼，能減少不必要的風險。", "sources": [1, 2, 7], "page": "trust-boundaries"}, "token-boundary": {"id": "token-boundary", "text": "MCP Server應驗證入站Token的有效性與適用對象；呼叫下游API時應另行取得下游所需的Token，不得把收到的Token原樣轉送。這項禁令不會因為入站Token已驗證就消失。", "sources": [6, 7], "page": "trust-boundaries"}, "conversation-boundary": {"id": "conversation-boundary", "text": "架構設計要求Server只取得必要情境，而非看遍完整對話；這個邊界仍要由Host與實作落實，不是貼上MCP標籤就自動成立。", "sources": [1], "page": "trust-boundaries"}}, "sources": [{"title": "Architecture", "url": "https://modelcontextprotocol.io/specification/2025-11-25/architecture", "download_url": "https://modelcontextprotocol.io/specification/2025-11-25/architecture.md", "version": "2025-11-25", "file": "raw/articles/architecture.md", "sha256": "a3edad22d0b49abbd8c6033d4f11bcd84205b99f626b645a3876b6187a43e03e", "characters": 5904, "retrieved_at": "2026-11-23T10:56:22.132945+00:00", "elapsed_seconds": 0.184, "status": "accepted", "source_id": 1}, {"title": "Tools", "url": "https://modelcontextprotocol.io/specification/2025-11-25/server/tools", "download_url": "https://modelcontextprotocol.io/specification/2025-11-25/server/tools.md", "version": "2025-11-25", "file": "raw/articles/server-tools.md", "sha256": "b0f76ef36804c096f98da2cae2fb5367c75cc1fe075d9259cb4a1424b3278f48", "characters": 14324, "retrieved_at": "2026-11-23T10:56:22.115481+00:00", "elapsed_seconds": 0.166, "status": "accepted", "source_id": 2}, {"title": "Resources", "url": "https://modelcontextprotocol.io/specification/2025-11-25/server/resources", "download_url": "https://modelcontextprotocol.io/specification/2025-11-25/server/resources.md", "version": "2025-11-25", "file": "raw/articles/server-resources.md", "sha256": "bfb8fd0e7f2874f22b3dbd484c68e3f9719ba6a08433e9ba1deb5c0bd8ee2cb4", "characters": 10222, "retrieved_at": "2026-11-23T10:56:22.110953+00:00", "elapsed_seconds": 0.161, "status": "accepted", "source_id": 3}, {"title": "Prompts", "url": "https://modelcontextprotocol.io/specification/2025-11-25/server/prompts", "download_url": "https://modelcontextprotocol.io/specification/2025-11-25/server/prompts.md", "version": "2025-11-25", "file": "raw/articles/server-prompts.md", "sha256": "2950e3dbb10223d2b328c22e47b897f2cc92a12565ff685cfdd090ab3e28dcfd", "characters": 7268, "retrieved_at": "2026-11-23T10:56:22.146894+00:00", "elapsed_seconds": 0.197, "status": "accepted", "source_id": 4}, {"title": "Lifecycle", "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/lifecycle", "download_url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/lifecycle.md", "version": "2025-11-25", "file": "raw/articles/basic-lifecycle.md", "sha256": "8b0528fc945468a000f12163af237cc34c2a0142c92c47134c7a82d5a884a51c", "characters": 9714, "retrieved_at": "2026-11-23T10:56:22.241234+00:00", "elapsed_seconds": 0.13, "status": "accepted", "source_id": 5}, {"title": "Authorization", "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization", "download_url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization.md", "version": "2025-11-25", "file": "raw/articles/basic-authorization.md", "sha256": "06a6771b789b3fef99f1218cb405de8eb85618d5b24b214bc3ca7b6bb30e3cf3", "characters": 41561, "retrieved_at": "2026-11-23T10:56:22.244959+00:00", "elapsed_seconds": 0.129, "status": "accepted", "source_id": 6}, {"title": "Security Best Practices", "url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices", "download_url": "https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices.md", "version": "2025-11-25", "file": "raw/articles/basic-security_best_practices.md", "sha256": "c144746562fc833b964b0c497f5b0aaa39a918946563d87c828d95921bb02784", "characters": 37387, "retrieved_at": "2026-11-23T10:56:22.321476+00:00", "elapsed_seconds": 0.188, "status": "accepted", "source_id": 7}], "slides": [{"id": "why-mcp", "title": "AI 怎麼真的查資料？", "eyebrow": "MCP 入門", "claims": ["definition"], "kind": "cover", "note": "用一個圖書館開放時間的教學情境，分清模型、應用與工具。"}, {"id": "connection", "title": "先把外部能力接進應用", "eyebrow": "01 · 解決的問題", "claims": ["integration"], "kind": "standard", "note": "MCP整理連接方式；要不要呼叫、怎麼處理結果，仍是應用的工作。"}, {"id": "roles", "title": "三個角色，各負其責", "eyebrow": "02 · 架構", "claims": ["host", "client", "server"], "kind": "roles"}, {"id": "primitives", "title": "執行操作、提供資料、套用模板", "eyebrow": "03 · 三種用途", "claims": ["tool-schema", "resources", "prompts"], "kind": "primitives"}, {"id": "tools", "title": "先看工具清單，再帶參數呼叫", "eyebrow": "04 · Tools", "claims": ["tool-schema", "tool-control"], "kind": "standard"}, {"id": "initialize", "title": "不是連上就能用所有功能", "eyebrow": "05 · 能力協商", "claims": ["handshake", "capabilities"], "kind": "standard"}, {"id": "walkthrough", "title": "走一次工具呼叫流程", "eyebrow": "06 · 互動示意", "claims": ["handshake", "tool-schema", "tool-result"], "kind": "simulation"}, {"id": "distinction", "title": "同一個情境，可以提供不同介面", "eyebrow": "07 · 例子不等於規定", "claims": ["primitive-distinction"], "kind": "example", "note": "假設：開館時間表可當Resource，查某日時間可做成Tool，行程整理可做成Prompt模板；這是本作業的設計例子。"}, {"id": "human-control", "title": "模型想呼叫，不等於可以執行", "eyebrow": "08 · 應用的責任", "claims": ["tool-control", "least-privilege"], "kind": "standard"}, {"id": "auth", "title": "HTTP與STDIO，授權方式不同", "eyebrow": "09 · Authorization", "claims": ["auth-scope", "stdio-scope"], "kind": "standard"}, {"id": "security", "title": "MCP不是安全保證書", "eyebrow": "10 · 信任邊界", "claims": ["token-boundary", "conversation-boundary"], "kind": "standard"}, {"id": "quiz", "title": "換你判斷這三件事", "eyebrow": "11 · 小測驗", "claims": ["client", "resources", "prompts", "auth-scope", "tool-control", "least-privilege"], "kind": "quiz"}, {"id": "takeaway", "title": "先問是哪個角色，再問有沒有權限", "eyebrow": "12 · 回到起點", "claims": ["definition", "server", "least-privilege"], "kind": "standard", "note": "看一個MCP整合時，先找Host、Client、Server，再確認能力與權限；不要只看它宣稱接了多少工具。"}, {"id": "sources", "title": "回到Wiki與官方文件核對", "eyebrow": "來源與版本", "claims": [], "kind": "s const steps=[
 ['使用者提出需求','Host接到「週一圖書館幾點開？」。此範例由應用把需求交給模型判斷；不是MCP自行決定目標。','教學假情境\n使用者：週一圖書館幾點開？'],
 ['先交換版本與能力','Client送initialize；Server回覆它支援tools。Client再送notifications/initialized，開始正常操作。','Client → Server: initialize\nprotocolVersion: 2025-11-25\nServer → Client: capabilities.tools\nClient → Server: notifications/initialized'],

 ['應用檢查是否允許呼叫','本教學假設查詢工具已獲准使用。Host檢查星期值；字串型別本身不保證值有效，Server仍須自行驗證參數及存取權限。這是應用政策示意。','Host policy（教學設定）\noperation: read-only query\nallowed tool: get_library_hours\nvalidated day: monday'],
 ['Client送出工具呼叫','模型提出要用的工具及參數後，由應用的Client傳送tools/call，Server處理操作。','{\n  "jsonrpc": "2.0",\n  "id": 3,\n  "method": "tools/call",\n  "params": {\n    "name": "get_library_hours",\n    "arguments": {"day": "monday"}\n  }\n}'],
 ['Server回傳結果','這裡顯示完整JSON-RPC回覆，id對應前一步的3；內容是固定教學假資料，不是真正圖書館API。真實應用仍要檢查結果或錯誤。','教學假資料（沒有送網路請求）\n{\n  "jsonrpc": "2.0",\n  "id": 3,\n  "result": {\n    "content": [{"type": "text",\n      "text": "週一 09:00–18:00"}],\n    "isError": false\n  }\n}'],
 ['應用整合成回答','Host把工具結果交給模型整理，再顯示給使用者。MCP處理訊息交換，這段教學沒有真的執行LLM或MCP服務。','整理後回答示意：\n「依這份教學假資料，週一開放時間為09:00–18:00。」']
];
function refs(ids){return ids.map(i=>{const s=DATA.sources.find(x=>x.source_id===i);return `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">[${i}] ${esc(s.title)}</a>`}).join(' ')}
function claimHtml(id){const c=DATA.claims[id];return `<p class="claim" data-claim="${esc(id)}">${esc(c.text)}</p>`}
function sourceIds(slide){return [...new Set(slide.claims.flatMap(id=>DATA.claims[id].sources))].sort((a,b)=>a-b)}
function resize(){const slide=document.querySelector('.slide'),vp=document.querySelector('.viewport');if(!slide)return;const scale=Math.min(1,(innerWidth-40)/1280,Math.max(300,innerHeight-180)/720),w=1280*scale;if(innerWidth>700){vp.style.width=w+'px';vp.style.height=(720*scale)+'px';slide.style.transform=`scale(${scale})`}else{vp.style.width='';vp.style.height='';slide.style.transform=''}}
function slideBody(s){
 if(s.kind==='roles'||s.kind==='primitives'){const labels=s.kind==='roles'?['Host｜應用總管','Client｜協定連接','Server｜能力提供者']:['Tool｜做一件事','Resource｜提供資料','Prompt｜提供模板'];return `<div class="triple">${s.claims.map((id,i)=>`<div><h2>${labels[i]}</h2>${claimHtml(id)}</div>`).join('')}</div>`}
 if(s.kind==='simulation'){const t=steps[simStep];return `<div class="badge">純前端模擬 · 不連線外部服務</div><div class="simulation"><div class="sim-step"><span class="sim-meta">步驟 ${simStep+1} / ${steps.length}</span><h2>${esc(t[0])}</h2><p>${esc(t[1])}</p><div class="sim-controls"><button id="sim-prev" ${simStep===0?'disabled':''}>上一步</button><button id="sim-next" class="primary" ${simStep===steps.length-1?'disabled':''}>下一步</button><button id="sim-reset">重設</button></div></div><pre id="sim-code">${esc(t[2])}</pre></div>`}
 if(s.kind==='quiz'){const q=qs[quizIndex],answered=quizAnswers[quizIndex]!==undefined;return `<div class="quiz"><p class="quiz-progress">第 ${quizIndex+1} / ${qs.length} 題</p><h2>${esc(q.q)}</h2><div class="options">${q.options.map((o,i)=>`<button class="quiz-option" data-answer="${i}" aria-pressed="${quizAnswers[quizIndex]===i}">${esc(o)}</button>`).join('')}</div><p class="quiz-result" id="quiz-result" aria-live="polite">${answered?(quizAnswers[quizIndex]===q.correct?'答對了。':'這個選項不正確。')+' '+esc(q.why):'選一個答案，查看理由。'}</p><div class="sim-meta">${refs(q.refs)}</div><div class="sim-controls"><button id="quiz-back" ${quizIndex===0?'disabled':''}>上一題</button><button id="quiz-next" ${quizIndex===qs.length-1?'disabled':''}>下一題</button><button id="quiz-reset">重新作答</button></div><p class="sim-meta">目前答對 ${quizAnswers.filter((a,i)=>a===qs[i].correct).length} / ${qs.length} 題 · 不上傳作答</p></div>`}
 if(s.kind==='sources'){return `<div class="source-lines">${DATA.sources.map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">[${x.source_id}] ${esc(x.title)}</a><br><small>規格版 ${esc(x.version)} · 官方原文</small></p>`).join('')}</div><p class="note">${esc(s.note)}</p>`}
 return `<div class="claims-list">${s.claims.map(claimHtml).join('')}</div>${s.note?`<p class="note">${esc(s.note)}</p>`:''}`;
}
function deck(){if(!DATA.slides.length){content.innerHTML='<p class="empty">沒有可顯示的投影片。</p>';return}const s=DATA.slides[position];content.innerHTML=`<div class="viewport"><article class="slide ${s.kind==='cover'?'cover':''}" id="${esc(s.id)}"><div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1><div class="slide-body">${slideBody(s)}</div><footer class="slide-foot"><div>${refs(sourceIds(s))}</div><span>${position+1} / ${DATA.slides.length}</span></footer></article></div>`;document.getElementById('prev').disabled=position===0;document.getElementById('next').disabled=position===DATA.slides.length-1;document.getElementById('jump').value=position;resize();wireSlide()}
function wireSlide(){const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};on('sim-prev',()=>{simStep=Math.max(0,simStep-1);deck()});on('sim-next',()=>{simStep=Math.min(steps.length-1,simStep+1);deck()});on('sim-reset',()=>{simStep=0;deck()});document.querySelectorAll('.quiz-option').forEach(e=>e.onclick=()=>{quizAnswers[quizIndex]=Number(e.dataset.answer);deck()});on('quiz-back',()=>{quizIndex=Math.max(0,quizIndex-1);deck()});on('quiz-next',()=>{quizIndex=Math.min(qs.length-1,quizIndex+1);deck()});on('quiz-reset',()=>{quizAnswers=[];quizIndex=0;deck()})}
function wiki(){const p=DATA.pages.find(x=>x.slug===page)||DATA.pages[0];content.innerHTML=`<div class="reading wiki-layout"><aside class="wiki-menu" aria-label="Wiki概念頁">${DATA.pages.map(x=>`<button data-page="${esc(x.slug)}" aria-pressed="${p.slug===x.slug}">${esc(x.title)}</button>`).join('')}</aside><article class="wiki-body"><p class="version">規格版 ${esc(DATA.protocol_version)} · 本次AI整理的概念Wiki</p><h1>${esc(p.title)}</h1>${p.claims.map(c=>`<div class="claim">${esc(c.text)}<div class="source-ref">${refs(c.sources)}</div></div>`).join('')}<h2>相關頁面</h2><div class="links">${p.links.map(slug=>`<button data-page="${esc(slug)}">${esc(DATA.pages.find(x=>x.slug===slug).title)}</button>`).join('')}</div></article></div>`;document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{page=e.dataset.page;setMode('wiki')})}
function mapping(){content.innerHTML=`<article class="reading"><h1>投影片 → Wiki → 官方原文</h1><p>下列對照由生成器直接讀取Wiki的claim_id，不是完成後才補寫的參考資料清單。</p><div class="table-wrap"><table><thead><tr><th>投影片</th><th>Wiki概念頁</th><th>claim_id</th><th>來源</th></tr></thead><tbody>${DATA.slides.filter(s=>s.claims.length).map((s,i)=>`<tr><td>${esc(s.title)}</td><td>${[...new Set(s.claims.map(id=>DATA.claims[id].page))].map(x=>esc(x)).join('<br>')}</td><td>${s.claims.map(x=>`<code>${esc(x)}</code>`).join('<br>')}</td><td>${refs(sourceIds(s))}</td></tr>`).join('')}</tbody></table></div><h2>來源擷取批次</h2><p class="small">原文快照不在公開網站重印；此處列出官方連結、擷取時間和SHA256供核對。摘要與概念頁是本作業重新整理的內容。</p>${DATA.sources.map(s=>`<details><summary>[${s.source_id}] ${esc(s.title)}</summary><p class="small">擷取時間：${esc(s.retrieved_at)}<br>SHA256：<code style="overflow-wrap:anywhere">${s.sha256}</code></p>${refs([s.source_id])}</details>`).join('')}</article>`}
function run(){const r=DATA.execution;content.innerHTML=`<article class="reading"><h1>這份簡報怎麼產生？</h1><p>本次由LLM整理Wiki與教學順序，再以Python執行檢查及生成。這是一個可重複執行、保留人工審閱的workflow，不是假稱每次都自動呼叫LLM的服務。</p><ol class="log-list"><li>先確認主題與新手教學範圍。</li><li>擷取七篇官方文件，檢查版本、回應內容與SHA256。</li><li>整理概念頁與claim_id，再查詢Wiki規劃投影片。</li><li>生成前檢查引用編號、概念連結、重複claim及投影片取材；失敗就回到對應節點修正。</li><li>通過後產生HTML及來源對照，再做瀏覽器與獨立內容審查。</li></ol><h2>本次Python執行紀錄</h2><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(r,null,2))}</pre><p class="small">負測案例是刻意修改記憶體中的資料副本，用來驗證檢查會擋錯；不是宣稱正式七篇來源真的發生同樣錯誤。語義正確性仍要回原文查核。</p></article>`}
function setMode(m,fromHash=false){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));nav.hidden=m!=='deck';if(m==='deck')deck();else if(m==='wiki')wiki();else if(m==='map')mapping();else run();if(!fromHash)history.replaceState(null,'',m==='deck'?'#slide='+position:m==='wiki'?'#wiki='+page:'#'+m)}
function go(n){position=Math.max(0,Math.min(DATA.slides.length-1,n));storedWrite('mcp-w10-slide',position);setMode('deck')}
document.getElementById('prev').onclick=()=>go(position-1);document.getElementById('next').onclick=()=>go(position+1);const jump=document.getElementById('jump');DATA.slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.title}`;jump.append(o)});jump.onchange=()=>go(Number(jump.value));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.addEventListener('keydown',e=>{if(mode!=='deck'||/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(position+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(position-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(DATA.slides.length-1)}});window.addEventListener('resize',resize);
function readHash(){const h=decodeURIComponent(location.hash.slice(1));if(/^slide=\d+$/.test(h)){position=Math.max(0,Math.min(DATA.slides.length-1,Number(h.split('=')[1])));setMode('deck',true)}else if(h.startsWith('wiki=')){page=h.slice(5);setMode('wiki',true)}else if(['map','run'].includes(h))setMode(h,true);else setMode('deck',true)}window.addEventListener('hashchange',readHash);readHash();
</script></body></html>
