<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MCP 入門｜從 Wiki 到教學簡報</title>
<style>
:root{--paper:#f4f0e8;--ink:#192924;--muted:#58665f;--line:#c9cfc6;--accent:#245d48;--light:#e5ece4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;padding:10px 16px;min-height:44px}button:hover{background:var(--light)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent)}button[aria-pressed=true],button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.35;cursor:default}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:12px 28px;border-bottom:1px solid var(--line);gap:20px}.brand{font-weight:700;letter-spacing:.05em;font-size:16px}.tabs{display:flex;gap:8px}.tabs button{font-size:14px}.workspace{padding:22px 20px}.viewport{position:relative;margin:auto}.slide{position:absolute;left:0;top:0;transform-origin:top left;width:1280px;height:720px;border:1px solid var(--line);padding:40px 50px 28px;display:flex;flex-direction:column;background:#fcfaf5}.eyebrow{font-size:18px;letter-spacing:.1em;color:var(--accent);margin-bottom:14px}.slide h1{font-size:49px;line-height:1.25;font-weight:700;margin:0 0 24px;letter-spacing:-.03em}.slide-body{font-size:29px;line-height:1.7;flex:1;min-height:0;overflow:auto}.slide-body p{margin:0 0 22px}.claim{margin-bottom:20px}.claims-list .claim+ .claim{padding-top:20px;border-top:1px solid var(--line)}.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.triple h2{font-size:28px;line-height:1.4;margin:0 0 12px}.triple .claim{font-size:25px;line-height:1.65;margin:0}.triple>div+div{border-left:1px solid var(--line);padding-left:26px}.note{color:var(--muted);font-size:23px;line-height:1.6}.slide-foot{display:flex;gap:14px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:18px;min-height:42px;font-size:17px;color:var(--muted)}.slide-foot a{margin-right:14px}.nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 0;font-size:14px}.nav select{font:inherit;max-width:260px;padding:10px;border:1px solid var(--line);background:transparent;color:var(--ink);min-height:44px}.cover h1{font-size:70px;max-width:940px}.cover .slide-body{max-width:1030px;font-size:35px}.cover .note{font-size:27px;margin-top:30px}.badge{font-size:16px;display:inline-block;padding:4px 10px;border:1px solid var(--line);color:var(--muted);margin-bottom:12px}.simulation{display:grid;grid-template-columns:.95fr 1.1fr;gap:30px}.sim-step{font-size:26px;line-height:1.6}.sim-step h2{font-size:30px;margin:8px 0 14px}.simulation pre{font-family:"Consolas","Noto Sans Mono",monospace;font-size:20px;line-height:1.6;white-space:pre-wrap;background:#eaf0e8;padding:22px;margin:0;overflow:auto;max-height:300px}.sim-controls{display:flex;align-items:center;gap:10px;margin-top:16px}.sim-controls button{font-size:18px}.sim-meta{font-size:19px;color:var(--muted)}.quiz h2{font-size:25px;margin:0 0 12px}.quiz .options{display:flex;gap:10px;flex-wrap:wrap}.quiz button{font-size:21px;text-align:left}.quiz-result{font-size:24px;margin:20px 0 8px}.quiz-progress{font-size:18px;color:var(--muted)}.source-lines{font-size:22px;line-height:1.8;display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}.source-lines p{margin:0}.source-lines small{font-size:16px;color:var(--muted)}.reading{max-width:1050px;margin:auto;line-height:1.9}.reading h1{font-size:32px}.reading h2{font-size:25px}.reading p{font-size:18px}.reading .version{color:var(--muted)}.wiki-layout{display:grid;grid-template-columns:220px 1fr;gap:42px}.wiki-menu{display:flex;flex-direction:column;gap:8px;align-self:start}.wiki-menu button{font-size:15px;text-align:left}.wiki-body{min-width:0}.wiki-body .claim{font-size:20px;margin-bottom:24px}.wiki-body h1{margin-top:0}.wiki-body .source-ref{font-size:15px}.links{display:flex;gap:12px;flex-wrap:wrap}.links button{font-size:14px}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:12px 8px;text-align:left;vertical-align:top}td code{word-break:break-word}details{margin:18px 0}summary{cursor:pointer}.log-list{font-size:18px}.log-list li{margin-bottom:12px}.empty{padding:40px;text-align:center}.small{font-size:15px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:700px){.top{height:auto;align-items:flex-start;flex-direction:column;padding:14px 16px;gap:12px}.tabs{width:100%;gap:5px;flex-wrap:wrap}.tabs button{font-size:13px;padding:8px 11px}.workspace{padding:16px 12px}.viewport{width:100%!important;height:auto!important}.slide{position:relative;transform:none!important;width:100%;height:auto;min-height:70vh;padding:26px 20px}.slide h1,.cover h1{font-size:34px;margin-bottom:22px}.eyebrow{font-size:14px}.slide-body,.cover .slide-body{font-size:20px;overflow:visible}.note,.cover .note{font-size:17px}.triple{grid-template-columns:1fr;gap:24px}.triple h2{font-size:23px}.triple .claim{font-size:19px}.triple>div+div{padding:22px 0 0;border-left:0;border-top:1px solid var(--line)}.slide-foot{align-items:flex-start;font-size:12px;line-height:1.8}.slide-foot>div{max-width:75%}.simulation{grid-template-columns:1fr;gap:16px}.sim-step{font-size:18px}.sim-step h2{font-size:23px}.simulation pre{font-size:14px;max-height:none;padding:16px}.badge{font-size:12px}.sim-controls{flex-wrap:wrap}.sim-controls button{font-size:15px}.sim-meta{font-size:14px}.quiz h2{font-size:22px}.quiz button{font-size:17px}.quiz-result{font-size:18px}.source-lines{grid-template-columns:1fr;font-size:18px}.source-lines small{font-size:13px}.nav{gap:8px;flex-wrap:wrap}.nav button{font-size:13px;padding:8px 12px}.nav select{max-width:200px;font-size:13px}.wiki-layout{grid-template-columns:1fr;gap:24px}.wiki-menu{flex-direction:row;overflow-x:auto;padding:0 0 12px}.wiki-menu button{min-width:140px}.wiki-body h1{font-size:27px}.wiki-body .claim{font-size:18px}.table-wrap{overflow-x:auto}.table-wrap table{min-width:720px}.reading h1{font-size:28px}}
@media print{.top,.nav,.sim-controls{display:none!important}.workspace{padding:0}.viewport{width:auto!important;height:auto!important}.slide{position:relative;transform:none!important;width:100%;height:auto;min-height:90vh;break-after:page}.slide-body{overflow:visible}.slide h1{font-size:30pt}.slide-body{font-size:18pt}}
</style></head><body>
<header class="top"><div class="brand">MCP / WIKI → LESSON</div><nav class="tabs" aria-label="內容切換"><button data-mode="deck">教學簡報</button><button data-mode="wiki">知識 Wiki</button><button data-mode="map">來源對照</button><button data-mode="run">執行紀錄</button></nav></header>
<main class="workspace"><div id="content"></div><div class="nav" id="deck-nav"><button id="prev">← 上一頁</button><label><span class="small">跳頁 </span><select id="jump" aria-label="選擇投影片"></select></label><button id="next">下一頁 →</button></div></main>
<script type="application/json" id="lesson-data">__DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lesson-data').textContent);
const content=document.getElementById('content'), nav=document.getElementById('deck-nav');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function storedRead(k){try{return localStorage.getItem(k)}catch{return null}}
function storedWrite(k,v){try{localStorage.setItem(k,v)}catch{}}
let position=Math.max(0,Math.min(DATA.slides.length-1,Number(storedRead('mcp-w10-slide'))||0));
let mode='deck', page='mcp-overview', simStep=0, quizIndex=0, quizAnswers=[];
const qs=[
 {q:'一個Host需要接兩個Server。依本教學架構，Client應怎麼安排？',options:['一個Client連兩個Server','為不同Server建立各自Client','Server取代Host即可'],correct:1,why:'Host可管理多個Client；每個Client與特定Server維持一對一連線。',refs:[1]},
 {q:'提供模型參考的「分館開放時間表」，比較接近哪種用途？',options:['Resource：提供上下文資料','Prompt：模型的私密思考','一定只能做成Tool'],correct:0,why:'若把時間表作為可讀上下文，就是Resource；查詢功能也能另設Tool，兩種設計不互斥。',refs:[2,3,4]},
 {q:'哪一個說法符合此版本授權規範？',options:['所有本機MCP都強制OAuth','只要是MCP就不必限制權限','HTTP授權與STDIO本機憑證取得要分開看'],correct:2,why:'此授權規範針對HTTP；STDIO不照搬同一流程。MCP標籤也不等於安全保證。',refs:[6,7]}
];
const steps=[
 ['使用者提出需求','Host接到「週一圖書館幾點開？」。此範例由應用把需求交給模型判斷；不是MCP自行決定目標。','教學假情境\n使用者：週一圖書館幾點開？'],
 ['先交換版本與能力','Client送initialize；Server回覆它支援tools。Client再送notifications/initialized，開始正常操作。','Client → Server: initialize\nprotocolVersion: 2025-11-25\nServer → Client: capabilities.tools\nClient → Server: notifications/initialized'],
 ['看可用工具與參數','Client以tools/list取得工具說明。這裡只提供get_library_hours，並要求day為字串。','tools/list\nname: get_library_hours\ninputSchema:\n  type: object\n  properties:\n    day: { type: string }\n  required: [day]'],
 ['應用檢查是否允許呼叫','本教學假設查詢工具已獲准使用。Host檢查星期值；字串型別本身不保證值有效，Server仍須自行驗證參數及存取權限。這是應用政策示意。','Host policy（教學設定）\noperation: read-only query\nallowed tool: get_library_hours\nvalidated day: monday'],
 ['Client送出工具呼叫','模型提出要用的工具及參數後，由應用的Client傳送tools/call，Server處理操作。','{\n  "jsonrpc": "2.0",\n  "id": 3,\n  "method": "tools/call",\n  "params": {\n    "name": "get_library_hours",\n    "arguments": {"day": "monday"}\n  }\n}'],
 ['Server回傳結果','這裡顯示完整JSON-RPC回覆，id對應前一步的3；內容是固定教學假資料，不是真正圖書館API。真實應用仍要檢查結果或錯誤。','教學假資料（沒有送網路請求）\n{\n  "jsonrpc": "2.0",\n  "id": 3,\n  "result": {\n    "content": [{"type": "text",\n      "text": "週一 09:00–18:00"}],\n    "isError": false\n  }\n}'],
 ['應用整合成回答','Host把工具結果交給模型整理，再顯示給使用者。MCP處理訊息交換，這段教學沒有真的執行LLM或MCP服務。','整理後回答示意：\n「依這份教學假資料，週一開放時間為09:00–18:00。」']
];
function refs(ids){return ids.map(i=>{const s=DATA.sources.find(x=>x.source_id===i);return `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">[${i}] ${esc(s.title)}</a>`}).join(' ')}
function claimHtml(id){const c=DATA.claims[id];return `<p class="claim" data-claim="${esc(id)}">${esc(c.text)}</p>`}
function sourceIds(slide){return [...new Set(slide.claims.flatMap(id=>DATA.claims[id].sources))].sort((a,b)=>a-b)}
function resize(){const slide=document.querySelector('.slide'),vp=document.querySelector('.viewport');if(!slide)return;const scale=Math.min(1,(innerWidth-40)/1280,Math.max(300,innerHeight-180)/720),w=1280*scale;if(innerWidth>700){vp.style.width=w+'px';vp.style.height=(720*scale)+'px';slide.style.transform=`scale(${scale})`}else{vp.style.width='';vp.style.height='';slide.style.transform=''}}
function slideBody(s){
 if(s.kind==='roles'||s.kind==='primitives'){const labels=s.kind==='roles'?['Host｜應用總管','Client｜協定連接','Server｜能力提供者']:['Tool｜做一件事','Resource｜提供資料','Prompt｜提供模板'];return `<div class="triple">${s.claims.map((id,i)=>`<div><h2>${labels[i]}</h2>${claimHtml(id)}</div>`).join('')}</div>`}
 if(s.kind==='simulation'){const t=steps[simStep];return `<div class="badge">純前端模擬 · 不連線外部服務</div><div class="simulation"><div class="sim-step"><span class="sim-meta">步驟 ${simStep+1} / ${steps.length}</span><h2>${esc(t[0])}</h2><p>${esc(t[1])}</p><div class="sim-controls"><button id="sim-prev" ${simStep===0?'disabled':''}>上一步</button><button id="sim-next" class="primary" ${simStep===steps.length-1?'disabled':''}>下一步</button><button id="sim-reset">重設</button></div></div><pre id="sim-code">${esc(t[2])}</pre></div>`}
 if(s.kind==='quiz'){const q=qs[quizIndex],answered=quizAnswers[quizIndex]!==undefined;return `<div class="quiz"><p class="quiz-progress">第 ${quizIndex+1} / ${qs.length} 題</p><h2>${esc(q.q)}</h2><div class="options">${q.options.map((o,i)=>`<button class="quiz-option" data-answer="${i}" aria-pressed="${quizAnswers[quizIndex]===i}">${esc(o)}</button>`).join('')}</div><p class="quiz-result" id="quiz-result" aria-live="polite">${answered?(quizAnswers[quizIndex]===q.correct?'答對了。':'這個選項不正確。')+' '+esc(q.why):'選一個答案，查看理由。'}</p><div class="sim-meta">${refs(q.refs)}</div><div class="sim-controls"><button id="quiz-back" ${quizIndex===0?'disabled':''}>上一題</button><button id="quiz-next" ${quizIndex===qs.length-1?'disabled':''}>下一題</button><button id="quiz-reset">重新作答</button></div><p class="sim-meta">目前答對 ${quizAnswers.filter((a,i)=>a===qs[i].correct).length} / ${qs.length} 題 · 不上傳作答</p></div>`}
 if(s.kind==='sources'){return `<div class="source-lines">${DATA.sources.map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">[${x.source_id}] ${esc(x.title)}</a><br><small>規格版 ${esc(x.version)} · 官方原文</small></p>`).join('')}</div><p class="note">${esc(s.note)}</p>`}
 return `<div class="claims-list">${s.claims.map(claimHtml).join('')}</div>${s.note?`<p class="note">${esc(s.note)}</p>`:''}`;
}
function deck(){if(!DATA.slides.length){content.innerHTML='<p class="empty">沒有可顯示的投影片。</p>';return}const s=DATA.slides[position];content.innerHTML=`<div class="viewport"><article class="slide ${s.kind==='cover'?'cover':''}" id="${esc(s.id)}"><div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1><div class="slide-body">${slideBody(s)}</div><footer class="slide-foot"><div>${refs(sourceIds(s))}</div><span>${position+1} / ${DATA.slides.length}</span></footer></article></div>`;document.getElementById('prev').disabled=position===0;document.getElementById('next').disabled=position===DATA.slides.length-1;document.getElementById('jump').value=position;resize();wireSlide()}
function wireSlide(){const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};on('sim-prev',()=>{simStep=Math.max(0,simStep-1);deck()});on('sim-next',()=>{simStep=Math.min(steps.length-1,simStep+1);deck()});on('sim-reset',()=>{simStep=0;deck()});document.querySelectorAll('.quiz-option').forEach(e=>e.onclick=()=>{quizAnswers[quizIndex]=Number(e.dataset.answer);deck()});on('quiz-back',()=>{quizIndex=Math.max(0,quizIndex-1);deck()});on('quiz-next',()=>{quizIndex=Math.min(qs.length-1,quizIndex+1);deck()});on('quiz-reset',()=>{quizAnswers=[];quizIndex=0;deck()})}
function wiki(){const p=DATA.pages.find(x=>x.slug===page)||DATA.pages[0];content.innerHTML=`<div class="reading wiki-layout"><aside class="wiki-menu" aria-label="Wiki概念頁">${DATA.pages.map(x=>`<button data-page="${esc(x.slug)}" aria-pressed="${p.slug===x.slug}">${esc(x.title)}</button>`).join('')}</aside><article class="wiki-body"><p class="version">規格版 ${esc(DATA.protocol_version)} · 本次AI整理的概念Wiki</p><h1>${esc(p.title)}</h1>${p.claims.map(c=>`<div class="claim">${esc(c.text)}<div class="source-ref">${refs(c.sources)}</div></div>`).join('')}<h2>相關頁面</h2><div class="links">${p.links.map(slug=>`<button data-page="${esc(slug)}">${esc(DATA.pages.find(x=>x.slug===slug).title)}</button>`).join('')}</div></article></div>`;document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{page=e.dataset.page;setMode('wiki')})}
function mapping(){content.innerHTML=`<article class="reading"><h1>投影片 → Wiki → 官方原文</h1><p>下列對照由生成器直接讀取Wiki的claim_id，不是完成後才補寫的參考資料清單。</p><div class="table-wrap"><table><thead><tr><th>投影片</th><th>Wiki概念頁</th><th>claim_id</th><th>來源</th></tr></thead><tbody>${DATA.slides.filter(s=>s.claims.length).map((s,i)=>`<tr><td>${esc(s.title)}</td><td>${[...new Set(s.claims.map(id=>DATA.claims[id].page))].map(x=>esc(x)).join('<br>')}</td><td>${s.claims.map(x=>`<code>${esc(x)}</code>`).join('<br>')}</td><td>${refs(sourceIds(s))}</td></tr>`).join('')}</tbody></table></div><h2>來源擷取批次</h2><p class="small">原文快照不在公開網站重印；此處列出官方連結、擷取時間和SHA256供核對。摘要與概念頁是本作業重新整理的內容。</p>${DATA.sources.map(s=>`<details><summary>[${s.source_id}] ${esc(s.title)}</summary><p class="small">擷取時間：${esc(s.retrieved_at)}<br>SHA256：<code style="overflow-wrap:anywhere">${s.sha256}</code></p>${refs([s.source_id])}</details>`).join('')}</article>`}
function run(){const r=DATA.execution;content.innerHTML=`<article class="reading"><h1>這份簡報怎麼產生？</h1><p>本次由LLM整理Wiki與教學順序，再以Python執行檢查及生成。這是一個可重複執行、保留人工審閱的workflow，不是假稱每次都自動呼叫LLM的服務。</p><ol class="log-list"><li>先確認主題與新手教學範圍。</li><li>擷取七篇官方文件，檢查版本、回應內容與SHA256。</li><li>整理概念頁與claim_id，再查詢Wiki規劃投影片。</li><li>生成前檢查引用編號、概念連結、重複claim及投影片取材；失敗就回到對應節點修正。</li><li>通過後產生HTML及來源對照，再做瀏覽器與獨立內容審查。</li></ol><h2>本次Python執行紀錄</h2><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(r,null,2))}</pre><p class="small">負測案例是刻意修改記憶體中的資料副本，用來驗證檢查會擋錯；不是宣稱正式七篇來源真的發生同樣錯誤。語義正確性仍要回原文查核。</p></article>`}
function setMode(m,fromHash=false){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));nav.hidden=m!=='deck';if(m==='deck')deck();else if(m==='wiki')wiki();else if(m==='map')mapping();else run();if(!fromHash)history.replaceState(null,'',m==='deck'?'#slide='+position:m==='wiki'?'#wiki='+page:'#'+m)}
function go(n){position=Math.max(0,Math.min(DATA.slides.length-1,n));storedWrite('mcp-w10-slide',position);setMode('deck')}
document.getElementById('prev').onclick=()=>go(position-1);document.getElementById('next').onclick=()=>go(position+1);const jump=document.getElementById('jump');DATA.slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.title}`;jump.append(o)});jump.onchange=()=>go(Number(jump.value));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.addEventListener('keydown',e=>{if(mode!=='deck'||/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(position+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(position-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(DATA.slides.length-1)}});window.addEventListener('resize',resize);
function readHash(){const h=decodeURIComponent(location.hash.slice(1));if(/^slide=\d+$/.test(h)){position=Math.max(0,Math.min(DATA.slides.length-1,Number(h.split('=')[1])));setMode('deck',true)}else if(h.startsWith('wiki=')){page=h.slice(5);setMode('wiki',true)}else if(['map','run'].includes(h))setMode(h,true);else setMode('deck',true)}window.addEventListener('hashchange',readHash);readHash();
</script></body></html>
